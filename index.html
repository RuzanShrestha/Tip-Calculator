<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: url('usa.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            margin: auto;
        }
        input, button {
            margin: 10px;
            padding: 8px;
            width: 90%;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tip Calculator</h2>
        <label>Bill Amount: $</label>
        <input type="number" id="bill" placeholder="Enter bill amount">

        <label>Tip %:</label>
        <input type="number" id="tip" placeholder="Enter tip percentage">

        <label>People:</label>
        <input type="number" id="people" placeholder="Enter number of people" value="1">

        <button onclick="calculateTip()">Calculate</button>

        <h3 id="result"></h3>
    </div>

    <script>
        function calculateTip() {
            let bill = parseFloat(document.getElementById("bill").value);
            let tipPercentage = parseFloat(document.getElementById("tip").value);
            let people = parseInt(document.getElementById("people").value) || 1;

            if (bill <= 0 || tipPercentage < 0) {
                document.getElementById("result").innerText = "Please enter valid numbers!";
                return;
            }

            let tip = (bill * tipPercentage) / 100;
            let total = bill + tip;
            let perPerson = total / people;

            document.getElementById("result").innerText = 
                `Tip: $${tip.toFixed(2)} | Total: $${total.toFixed(2)} | Per Person: $${perPerson.toFixed(2)}`;
        }
    </script>

</body>
</html>
