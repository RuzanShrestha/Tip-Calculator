<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600&display=swap');

      body {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
          background-color: #1D1D1F;
          color: #F5F5F7;
          margin: 0;
          padding: 0;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
      }

      .container {
          background: rgba(28, 28, 30, 0.8);
          padding: 40px;
          border-radius: 12px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
          width: 350px;
          text-align: center;
          backdrop-filter: blur(10px);
      }

      h2 {
          font-weight: 600;
          margin-bottom: 20px;
          color: #F5F5F7;
      }

      input {
          width: 100%;
          padding: 12px;
          margin: 10px 0;
          border: 1px solid #3A3A3C;
          border-radius: 8px;
          font-size: 16px;
          background: #2C2C2E;
          color: #F5F5F7;
          outline: none;
          transition: all 0.2s ease-in-out;
      }

      input:focus {
          border-color: #0071E3;
          box-shadow: 0 0 10px rgba(0, 113, 227, 0.5);
      }

      button {
          width: 100%;
          padding: 12px;
          background: #0071E3;
          color: white;
          font-size: 16px;
          font-weight: 600;
          border: none;
          border-radius: 8px;
          cursor: pointer;
          transition: background 0.3s ease-in-out, transform 0.1s ease-in-out;
      }

      button:hover {
          background: #005BB5;
      }

      button:active {
          transform: scale(0.98);
      }

      h3 {
          font-weight: 500;
          margin-top: 20px;
      }

    </style>
</head>
<body>
    <div class="container">
        <h2>Tip Calculator</h2>
        <label>Bill Amount ($)</label>
        <input type="number" id="bill" placeholder="Enter bill amount">

        <label>Tip %</label>
        <input type="number" id="tip" placeholder="Enter tip percentage">

        <label>People</label>
        <input type="number" id="people" placeholder="Enter number of people" value="1">

        <button onclick="calculateTip()">Calculate</button>

        <h3 id="result"></h3>
    </div>

    <script>
        function calculateTip() {
            let bill = parseFloat(document.getElementById("bill").value);
            let tipPercentage = parseFloat(document.getElementById("tip").value);
            let people = parseInt(document.getElementById("people").value) || 1;

            if (bill <= 0 || tipPercentage < 0) {
                document.getElementById("result").innerText = "Please enter valid numbers!";
                return;
            }

            let tip = (bill * tipPercentage) / 100;
            let total = bill + tip;
            let perPerson = total / people;

            document.getElementById("result").innerText = 
                `Tip: $${tip.toFixed(2)} | Total: $${total.toFixed(2)} | Per Person: $${perPerson.toFixed(2)}`;
        }
    </script>
</body>
</html>
